<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Stacked balikbayan boxes ready for shipping">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd9"/>
      <stop offset="1" stop-color="#dcc4a0"/>
    </linearGradient>
    <linearGradient id="frontG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c095"/>
      <stop offset="1" stop-color="#cfa877"/>
    </linearGradient>
    <linearGradient id="topG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2e2c1"/>
      <stop offset="1" stop-color="#e4cfa6"/>
    </linearGradient>
    <linearGradient id="sideG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c49b6c"/>
      <stop offset="1" stop-color="#a87f52"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>
  <!-- floor shadow -->
  <ellipse cx="470" cy="533" rx="330" ry="34" fill="#8a6a45" opacity=".22"/>

  <!-- ================= back-left medium box ================= -->
  <g stroke="#7d5f3c" stroke-width="3" stroke-linejoin="round">
    <polygon points="120,318 176,276 356,276 300,318" fill="url(#topG)"/>
    <polygon points="300,318 356,276 356,452 300,494" fill="url(#sideG)"/>
    <polygon points="120,318 300,318 300,494 120,494" fill="url(#frontG)"/>
  </g>
  <!-- tape -->
  <rect x="120" y="358" width="180" height="15" fill="#b98f57" opacity=".55"/>
  <polygon points="204,318 260,276 274,276 218,318" fill="#b98f57" opacity=".45"/>
  <!-- small label -->
  <rect x="150" y="398" width="118" height="62" rx="3" fill="#fffdf7" stroke="#9a7a4f" stroke-width="2"/>
  <rect x="150" y="398" width="118" height="13" fill="#F0531C"/>
  <g fill="#7a6a55">
    <rect x="158" y="420" width="86" height="5" rx="2.5"/>
    <rect x="158" y="432" width="100" height="5" rx="2.5"/>
    <rect x="158" y="444" width="66" height="5" rx="2.5"/>
  </g>

  <!-- ================= small box stacked on top-left ================= -->
  <g stroke="#7d5f3c" stroke-width="3" stroke-linejoin="round">
    <polygon points="146,190 190,157 330,157 286,190" fill="url(#topG)"/>
    <polygon points="286,190 330,157 330,244 286,276" fill="url(#sideG)"/>
    <polygon points="146,190 286,190 286,276 146,276" fill="url(#frontG)"/>
  </g>
  <rect x="146" y="222" width="140" height="12" fill="#b98f57" opacity=".55"/>
  <polygon points="209,190 253,157 264,157 220,190" fill="#b98f57" opacity=".45"/>

  <!-- ================= main front box ================= -->
  <g stroke="#6f5334" stroke-width="3.5" stroke-linejoin="round">
    <polygon points="330,286 410,228 730,228 650,286" fill="url(#topG)"/>
    <polygon points="650,286 730,228 730,452 650,510" fill="url(#sideG)"/>
    <polygon points="330,286 650,286 650,510 330,510" fill="url(#frontG)"/>
  </g>
  <!-- packing tape: horizontal band + centre seam on the lid -->
  <rect x="330" y="330" width="320" height="20" fill="#b98f57" opacity=".55"/>
  <polygon points="480,286 560,228 578,228 498,286" fill="#b98f57" opacity=".5"/>
  <!-- corrugation hint on the side face -->
  <g stroke="#8a6a45" stroke-width="2" opacity=".35">
    <line x1="668" y1="290" x2="668" y2="500"/>
    <line x1="690" y1="274" x2="690" y2="484"/>
    <line x1="712" y1="258" x2="712" y2="468"/>
  </g>

  <!-- shipping label -->
  <rect x="372" y="372" width="238" height="112" rx="4" fill="#fffdf7" stroke="#8a6a45" stroke-width="2.5"/>
  <rect x="372" y="372" width="238" height="26" fill="#F0531C"/>
  <text x="491" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.4">BALIKBAYAN BOX</text>
  <g fill="#6f6252">
    <rect x="386" y="410" width="150" height="7" rx="3.5"/>
    <rect x="386" y="426" width="196" height="7" rx="3.5"/>
    <rect x="386" y="442" width="120" height="7" rx="3.5"/>
  </g>
  <!-- barcode -->
  <g fill="#3c352c">
    <rect x="386" y="458" width="3" height="16"/><rect x="392" y="458" width="2" height="16"/>
    <rect x="397" y="458" width="4" height="16"/><rect x="404" y="458" width="2" height="16"/>
    <rect x="409" y="458" width="3" height="16"/><rect x="415" y="458" width="5" height="16"/>
    <rect x="423" y="458" width="2" height="16"/><rect x="428" y="458" width="3" height="16"/>
    <rect x="434" y="458" width="4" height="16"/><rect x="441" y="458" width="2" height="16"/>
    <rect x="446" y="458" width="3" height="16"/><rect x="452" y="458" width="5" height="16"/>
  </g>

  <!-- ================= right-side upright box ================= -->
  <g stroke="#7d5f3c" stroke-width="3" stroke-linejoin="round">
    <polygon points="726,336 762,310 846,310 810,336" fill="url(#topG)"/>
    <polygon points="810,336 846,310 846,466 810,492" fill="url(#sideG)"/>
    <polygon points="726,336 810,336 810,492 726,492" fill="url(#frontG)"/>
  </g>
  <rect x="726" y="372" width="84" height="12" fill="#b98f57" opacity=".55"/>
  <polygon points="762,336 798,310 807,310 771,336" fill="#b98f57" opacity=".45"/>
</svg>
